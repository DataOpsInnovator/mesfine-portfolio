<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc">
<title id="title">AI infrastructure review workflow</title><desc id="desc">A proposed safe workflow from read-only source intake through parsing and deterministic checks, optional AI-assisted explanation, structured findings and human approval. The diagram is conceptual and not a claim that all stages are implemented.</desc>
<defs><style>.bg{fill:#080d15}.panel{fill:#101a27;stroke:#34475e;stroke-width:2}.accent{fill:#102c35;stroke:#29c8bf;stroke-width:2}.warm{fill:#302417;stroke:#e8b65b;stroke-width:2}.txt{font:600 20px system-ui,sans-serif;fill:#edf4fb}.sub{font:15px system-ui,sans-serif;fill:#a9b8ca}.label{font:700 14px system-ui,sans-serif;letter-spacing:2px;fill:#69ded7}.line{stroke:#6e8ba8;stroke-width:2.5;fill:none}</style><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#6e8ba8"/></marker></defs>
<rect class="bg" width="1200" height="700" rx="24"/><text x="48" y="54" class="label">AI-INFRA-AGENT / REVIEW WORKFLOW</text><text x="48" y="83" class="sub">Conceptual architecture — implementation status must be verified against source code and tests.</text>
<rect class="panel" x="45" y="145" width="240" height="112" rx="14"/><text x="165" y="184" text-anchor="middle" class="txt">Source intake</text><text x="165" y="213" text-anchor="middle" class="sub">Terraform · config · metadata</text><text x="165" y="235" text-anchor="middle" class="sub">Read-only, scoped inputs</text>
<rect class="accent" x="345" y="145" width="245" height="112" rx="14"/><text x="467" y="184" text-anchor="middle" class="txt">Parse + validate</text><text x="467" y="213" text-anchor="middle" class="sub">Schema · syntax · policy</text><text x="467" y="235" text-anchor="middle" class="sub">Deterministic checks first</text>
<rect class="panel" x="650" y="145" width="245" height="112" rx="14"/><text x="772" y="184" text-anchor="middle" class="txt">Analysis layer</text><text x="772" y="213" text-anchor="middle" class="sub">Security · cost · reliability</text><text x="772" y="235" text-anchor="middle" class="sub">AI explanation, if enabled</text>
<rect class="warm" x="955" y="145" width="200" height="112" rx="14"/><text x="1055" y="184" text-anchor="middle" class="txt">Findings</text><text x="1055" y="213" text-anchor="middle" class="sub">Evidence · severity</text><text x="1055" y="235" text-anchor="middle" class="sub">Recommendation</text>
<path class="line" marker-end="url(#arrow)" d="M285 201 H340"/><path class="line" marker-end="url(#arrow)" d="M590 201 H645"/><path class="line" marker-end="url(#arrow)" d="M895 201 H950"/>
<rect class="panel" x="160" y="365" width="350" height="125" rx="14"/><text x="335" y="407" text-anchor="middle" class="txt">Guardrails + audit trail</text><text x="335" y="436" text-anchor="middle" class="sub">No cloud mutations by default</text><text x="335" y="458" text-anchor="middle" class="sub">Redact secrets · record tool versions</text>
<rect class="accent" x="650" y="365" width="390" height="125" rx="14"/><text x="845" y="407" text-anchor="middle" class="txt">Human review + CI evidence</text><text x="845" y="436" text-anchor="middle" class="sub">Review findings and proposed changes</text><text x="845" y="458" text-anchor="middle" class="sub">Test · approve · archive results</text>
<path class="line" marker-end="url(#arrow)" d="M1055 257 V315 H845 V360"/><path class="line" marker-end="url(#arrow)" d="M772 257 V300 H335 V360"/><path class="line" marker-end="url(#arrow)" d="M510 427 H645"/>
<rect class="warm" x="315" y="555" width="570" height="88" rx="14"/><text x="600" y="590" text-anchor="middle" class="txt">Reproducible review output</text><text x="600" y="618" text-anchor="middle" class="sub">Input revision · tool versions · findings · reviewer decision</text><path class="line" marker-end="url(#arrow)" d="M845 490 V525 H600 V550"/>
</svg>