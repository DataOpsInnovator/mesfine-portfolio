<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 560" role="img" aria-labelledby="title desc"><title id="title">DevOps CI/CD and Terraform pipeline</title><desc id="desc">Source-backed Jenkins stages; note the repository URL mismatch in the current Jenkinsfile. The diagram shows five stages connected left to right.</desc><defs><style>.bg{fill:#080d15}.txt{font:600 21px system-ui,sans-serif;fill:#edf4fb}.sub{font:15px system-ui,sans-serif;fill:#a9b8ca}.eyebrow{font:700 15px system-ui,sans-serif;letter-spacing:2px;fill:#69ded7}.note{font:16px system-ui,sans-serif;fill:#a9b8ca}</style><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#6e8ba8"/></marker></defs><rect class="bg" width="1400" height="560" rx="24"/><text x="45" y="55" class="eyebrow">MESFIN GETACHEW / ENGINEERING CASE STUDY</text><text x="45" y="112" class="txt" style="font-size:32px">DevOps CI/CD and Terraform pipeline</text><text x="45" y="151" class="note">Source-backed Jenkins stages; note the repository URL mismatch in the current Jenkinsfile</text><rect x="38" y="215" width="250.4" height="160" rx="18" fill="#101a27" stroke="#29c8bf" stroke-width="2"/><text x="163.2" y="272" class="txt" text-anchor="middle">Git checkout</text><text x="163.2" y="309" class="sub" text-anchor="middle">Configured repository</text><rect x="306.4" y="215" width="250.4" height="160" rx="18" fill="#101a27" stroke="#29c8bf" stroke-width="2"/><text x="431.59999999999997" y="272" class="txt" text-anchor="middle">Terraform init</text><text x="431.59999999999997" y="309" class="sub" text-anchor="middle">AWS credentials binding</text><rect x="574.8" y="215" width="250.4" height="160" rx="18" fill="#101a27" stroke="#29c8bf" stroke-width="2"/><text x="700" y="272" class="txt" text-anchor="middle">Plan (optional)</text><text x="700" y="309" class="sub" text-anchor="middle">PLAN_TERRAFORM</text><rect x="843.1999999999999" y="215" width="250.4" height="160" rx="18" fill="#101a27" stroke="#29c8bf" stroke-width="2"/><text x="968.4" y="272" class="txt" text-anchor="middle">Apply (optional)</text><text x="968.4" y="309" class="sub" text-anchor="middle">APPLY_TERRAFORM</text><rect x="1111.6" y="215" width="250.4" height="160" rx="18" fill="#302417" stroke="#e8b65b" stroke-width="2"/><text x="1236.8" y="272" class="txt" text-anchor="middle">Destroy (optional)</text><text x="1236.8" y="309" class="sub" text-anchor="middle">DESTROY_TERRAFORM</text><path d="M290.4 295 h13" stroke="#6e8ba8" stroke-width="3" fill="none" marker-end="url(#arrow)"/><path d="M558.8 295 h13" stroke="#6e8ba8" stroke-width="3" fill="none" marker-end="url(#arrow)"/><path d="M827.2 295 h13" stroke="#6e8ba8" stroke-width="3" fill="none" marker-end="url(#arrow)"/><path d="M1095.6 295 h13" stroke="#6e8ba8" stroke-width="3" fill="none" marker-end="url(#arrow)"/><text x="45" y="450" class="note">Architecture view is not proof of a successful deployment or test run.</text></svg>