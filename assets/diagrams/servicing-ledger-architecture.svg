<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 650" role="img" aria-labelledby="title desc"><title id="title">Servicing Ledger Platform: local implementation and AWS reference design</title><desc id="desc">Two rows of five stages. The top row is the local implementation: a client sends a request with an idempotency key to the API, which writes the entry, an audit row and an outbox row in one transaction; a worker then records a unique consumer receipt. The bottom row is an AWS reference design that is not deployed: an API on EKS, PostgreSQL, an outbox publisher, an SQS Standard queue with a dead-letter queue, and an idempotent consumer.</desc><defs><style>.bg{fill:#080d15}.txt{font:600 20px system-ui,sans-serif;fill:#edf4fb}.sub{font:14.5px system-ui,sans-serif;fill:#a9b8ca}.eyebrow{font:700 15px system-ui,sans-serif;letter-spacing:2px;fill:#69ded7}.band-a{font:700 14px system-ui,sans-serif;letter-spacing:2px;fill:#69ded7}.band-b{font:700 14px system-ui,sans-serif;letter-spacing:2px;fill:#e8b65b}.note{font:16px system-ui,sans-serif;fill:#a9b8ca}</style><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#6e8ba8"/></marker></defs><rect class="bg" width="1400" height="650" rx="24"/><text x="45" y="55" class="eyebrow">MESFIN GETACHEW / ENGINEERING CASE STUDY</text><text x="45" y="100" class="txt" style="font-size:30px">Servicing Ledger Platform</text><text x="38" y="132" class="band-a">LOCAL IMPLEMENTATION · RUNS TODAY (PYTHON + SQLITE)</text><rect x="38" y="150" width="236" height="125" rx="18" fill="#101a27" stroke="#29c8bf" stroke-width="2"/><text x="156.0" y="198" class="txt" text-anchor="middle">Client</text><text x="156.0" y="230" class="sub" text-anchor="middle">synthetic request</text><text x="156.0" y="252" class="sub" text-anchor="middle">Idempotency-Key header</text><rect x="310" y="150" width="236" height="125" rx="18" fill="#101a27" stroke="#29c8bf" stroke-width="2"/><text x="428.0" y="198" class="txt" text-anchor="middle">Servicing API</text><text x="428.0" y="230" class="sub" text-anchor="middle">validate input</text><text x="428.0" y="252" class="sub" text-anchor="middle">canonical request hash</text><rect x="582" y="150" width="236" height="125" rx="18" fill="#101a27" stroke="#29c8bf" stroke-width="2"/><text x="700.0" y="198" class="txt" text-anchor="middle">Single transaction</text><text x="700.0" y="230" class="sub" text-anchor="middle">entry · audit · outbox</text><text x="700.0" y="252" class="sub" text-anchor="middle">unique idempotency key</text><rect x="854" y="150" width="236" height="125" rx="18" fill="#101a27" stroke="#29c8bf" stroke-width="2"/><text x="972.0" y="198" class="txt" text-anchor="middle">Outbox worker</text><text x="972.0" y="230" class="sub" text-anchor="middle">polls unhandled rows</text><text x="972.0" y="252" class="sub" text-anchor="middle">simulates publisher</text><rect x="1126" y="150" width="236" height="125" rx="18" fill="#101a27" stroke="#29c8bf" stroke-width="2"/><text x="1244.0" y="198" class="txt" text-anchor="middle">Consumer receipt</text><text x="1244.0" y="230" class="sub" text-anchor="middle">unique per event ID</text><text x="1244.0" y="252" class="sub" text-anchor="middle">replay adds no second effect</text><path d="M276 212.5 h27" stroke="#6e8ba8" stroke-width="3" fill="none" marker-end="url(#arrow)"/><path d="M548 212.5 h27" stroke="#6e8ba8" stroke-width="3" fill="none" marker-end="url(#arrow)"/><path d="M820 212.5 h27" stroke="#6e8ba8" stroke-width="3" fill="none" marker-end="url(#arrow)"/><path d="M1092 212.5 h27" stroke="#6e8ba8" stroke-width="3" fill="none" marker-end="url(#arrow)"/><text x="38" y="392" class="band-b">AWS REFERENCE DESIGN · NOT DEPLOYED</text><rect x="38" y="410" width="236" height="125" rx="18" fill="#0c1420" stroke="#8aa0b8" stroke-width="2" stroke-dasharray="8 6"/><text x="156.0" y="458" class="txt" text-anchor="middle">API on EKS</text><text x="156.0" y="490" class="sub" text-anchor="middle">containerized service</text><text x="156.0" y="512" class="sub" text-anchor="middle">not deployed</text><rect x="310" y="410" width="236" height="125" rx="18" fill="#0c1420" stroke="#8aa0b8" stroke-width="2" stroke-dasharray="8 6"/><text x="428.0" y="458" class="txt" text-anchor="middle">PostgreSQL</text><text x="428.0" y="490" class="sub" text-anchor="middle">same transaction boundary</text><text x="428.0" y="512" class="sub" text-anchor="middle">replaces SQLite</text><rect x="582" y="410" width="236" height="125" rx="18" fill="#0c1420" stroke="#8aa0b8" stroke-width="2" stroke-dasharray="8 6"/><text x="700.0" y="458" class="txt" text-anchor="middle">Outbox publisher</text><text x="700.0" y="490" class="sub" text-anchor="middle">sends committed rows</text><text x="700.0" y="512" class="sub" text-anchor="middle">may send duplicates</text><rect x="854" y="410" width="236" height="125" rx="18" fill="#0c1420" stroke="#8aa0b8" stroke-width="2" stroke-dasharray="8 6"/><text x="972.0" y="458" class="txt" text-anchor="middle">SQS Standard</text><text x="972.0" y="490" class="sub" text-anchor="middle">at-least-once · with DLQ</text><text x="972.0" y="512" class="sub" text-anchor="middle">poison events quarantined</text><rect x="1126" y="410" width="236" height="125" rx="18" fill="#0c1420" stroke="#8aa0b8" stroke-width="2" stroke-dasharray="8 6"/><text x="1244.0" y="458" class="txt" text-anchor="middle">Consumer</text><text x="1244.0" y="490" class="sub" text-anchor="middle">idempotent: receipt + effect</text><text x="1244.0" y="512" class="sub" text-anchor="middle">in one database transaction</text><path d="M276 472.5 h27" stroke="#6e8ba8" stroke-width="3" fill="none" marker-end="url(#arrow)"/><path d="M548 472.5 h27" stroke="#6e8ba8" stroke-width="3" fill="none" marker-end="url(#arrow)"/><path d="M820 472.5 h27" stroke="#6e8ba8" stroke-width="3" fill="none" marker-end="url(#arrow)"/><path d="M1092 472.5 h27" stroke="#6e8ba8" stroke-width="3" fill="none" marker-end="url(#arrow)"/><text x="38" y="588" class="note">Delivery is at least once. The consumer’s durable receipt, not the transport, prevents duplicate business effects.</text><text x="38" y="616" class="note">Synthetic data only. This diagram is not proof of an AWS deployment or a test run.</text></svg>