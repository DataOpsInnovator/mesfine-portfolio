<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
<title id="title">CareFlow reference architecture</title><desc id="desc">A portfolio architecture view showing source control and secure CI, artifact publication, GitOps delivery to primary and secondary AWS regions, regional EKS workloads, managed data and messaging services, and centralized observability and disaster recovery.</desc>
<defs><style>.bg{fill:#080d15}.panel{fill:#101a27;stroke:#34475e;stroke-width:2}.accent{fill:#102c35;stroke:#29c8bf;stroke-width:2}.warm{fill:#302417;stroke:#e8b65b;stroke-width:2}.txt{font:600 20px system-ui,sans-serif;fill:#edf4fb}.sub{font:15px system-ui,sans-serif;fill:#a9b8ca}.label{font:700 14px system-ui,sans-serif;letter-spacing:2px;fill:#69ded7}.line{stroke:#6e8ba8;stroke-width:2.5;fill:none}.dash{stroke:#e8b65b;stroke-width:2;stroke-dasharray:7 7;fill:none}</style><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#6e8ba8"/></marker></defs>
<rect class="bg" width="1200" height="760" rx="24"/>
<text x="48" y="54" class="label">CARE FLOW / REFERENCE ARCHITECTURE</text><text x="48" y="83" class="sub">Portfolio design view — confirm deployment state in the repository before treating as live topology.</text>
<rect class="panel" x="45" y="115" width="240" height="95" rx="14"/><text x="165" y="151" text-anchor="middle" class="txt">GitHub</text><text x="165" y="179" text-anchor="middle" class="sub">Pull request · OIDC</text>
<rect class="accent" x="355" y="115" width="300" height="95" rx="14"/><text x="505" y="151" text-anchor="middle" class="txt">CI + security gates</text><text x="505" y="179" text-anchor="middle" class="sub">Validate · scan · SBOM · sign</text>
<rect class="panel" x="725" y="115" width="190" height="95" rx="14"/><text x="820" y="151" text-anchor="middle" class="txt">Amazon ECR</text><text x="820" y="179" text-anchor="middle" class="sub">Image artifacts</text>
<rect class="warm" x="985" y="115" width="170" height="95" rx="14"/><text x="1070" y="151" text-anchor="middle" class="txt">Argo CD</text><text x="1070" y="179" text-anchor="middle" class="sub">GitOps sync</text>
<path class="line" marker-end="url(#arrow)" d="M285 162 H350"/><path class="line" marker-end="url(#arrow)" d="M655 162 H720"/><path class="line" marker-end="url(#arrow)" d="M915 162 H980"/>
<rect class="panel" x="45" y="270" width="530" height="300" rx="18"/><text x="72" y="305" class="label">PRIMARY AWS REGION</text>
<rect class="accent" x="75" y="330" width="470" height="92" rx="12"/><text x="310" y="365" text-anchor="middle" class="txt">Private Amazon EKS</text><text x="310" y="393" text-anchor="middle" class="sub">Karpenter · policy guardrails · network policy</text>
<rect class="panel" x="75" y="445" width="220" height="88" rx="12"/><text x="185" y="478" text-anchor="middle" class="txt">API + workers</text><text x="185" y="506" text-anchor="middle" class="sub">Helm-managed workloads</text>
<rect class="panel" x="320" y="445" width="225" height="88" rx="12"/><text x="432" y="478" text-anchor="middle" class="txt">SRE controls</text><text x="432" y="506" text-anchor="middle" class="sub">SLOs · alerts · telemetry</text>
<rect class="panel" x="625" y="270" width="530" height="300" rx="18"/><text x="652" y="305" class="label">SECONDARY AWS REGION</text>
<rect class="accent" x="655" y="330" width="470" height="92" rx="12"/><text x="890" y="365" text-anchor="middle" class="txt">Private Amazon EKS</text><text x="890" y="393" text-anchor="middle" class="sub">Warm-standby regional workload</text>
<rect class="panel" x="655" y="445" width="220" height="88" rx="12"/><text x="765" y="478" text-anchor="middle" class="txt">Regional services</text><text x="765" y="506" text-anchor="middle" class="sub">Failover target</text>
<rect class="panel" x="900" y="445" width="225" height="88" rx="12"/><text x="1012" y="478" text-anchor="middle" class="txt">Recovery controls</text><text x="1012" y="506" text-anchor="middle" class="sub">Restore · failover · failback</text>
<path class="line" marker-end="url(#arrow)" d="M1070 210 V245 H310 V325"/><path class="line" marker-end="url(#arrow)" d="M1070 245 H890 V325"/><path class="dash" d="M575 455 H620"/><path class="dash" d="M575 490 H620"/>
<rect class="warm" x="185" y="620" width="830" height="85" rx="14"/><text x="600" y="654" text-anchor="middle" class="txt">Managed data + shared platform services</text><text x="600" y="682" text-anchor="middle" class="sub">Aurora PostgreSQL · S3 · SQS / DLQ · EventBridge · KMS · backup and recovery</text>
